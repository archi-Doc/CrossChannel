name: Build and Test

on:
  push:
    branches: [ main ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
    - name: Setup .NET Core
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x
    - name: Install dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --configuration Release --no-restore
    - name: Test
      run: dotnet test --no-restore --verbosity normal

  native-aot:
    name: Native AOT

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
    - name: Setup .NET Core
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x
    - name: Install the Native AOT prerequisites
      run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev
    # Fails the build on any trimming/AOT warning, then runs the published binary to
    # confirm that CrossChannel behaves identically without dynamic code generation.
    - name: Publish
      run: dotnet publish AotTest/AotTest.csproj -c Release -r linux-x64 -warnaserror
    - name: Run
      run: ./AotTest/bin/Release/net10.0/linux-x64/publish/AotTest
