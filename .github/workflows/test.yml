name: Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
    - name: Setup .NET Core
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x
    - name: Install dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --configuration Release --no-restore
    - name: Test
      run: dotnet test --no-restore --verbosity normal

  native-aot:
    name: Native AOT (${{ matrix.rid }})

    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v5
    - name: Setup .NET Core
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x
    - name: Install the Native AOT prerequisites
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev
    # Fails the build on any trimming/AOT warning, then runs the published binary to
    # confirm that CrossChannel behaves identically without dynamic code generation.
    - name: Publish
      run: dotnet publish AotTest/AotTest.csproj -c Release -r ${{ matrix.rid }} -warnaserror
    - name: Run (Linux)
      if: runner.os == 'Linux'
      run: ./AotTest/bin/Release/net10.0/linux-x64/publish/AotTest --require-no-dynamic-code
    - name: Run (Windows)
      if: runner.os == 'Windows'
      run: ./AotTest/bin/Release/net10.0/win-x64/publish/AotTest.exe --require-no-dynamic-code
